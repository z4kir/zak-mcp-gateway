<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ZAK MCP Gateway</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0b4f6c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- many MCP servers flowing in -->
  <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round">
    <path d="M124 136 C 196 136, 196 256, 236 256" opacity="0.55"/>
    <path d="M124 208 C 188 208, 196 256, 236 256" opacity="0.8"/>
    <path d="M124 304 C 188 304, 196 256, 236 256" opacity="0.8"/>
    <path d="M124 376 C 196 376, 196 256, 236 256" opacity="0.55"/>
  </g>
  <g fill="#ffffff">
    <circle cx="112" cy="136" r="24" opacity="0.7"/>
    <circle cx="112" cy="208" r="24" opacity="0.9"/>
    <circle cx="112" cy="304" r="24" opacity="0.9"/>
    <circle cx="112" cy="376" r="24" opacity="0.7"/>
  </g>
  <!-- the gateway, with a Z -->
  <rect x="226" y="176" width="118" height="160" rx="32" fill="#ffffff"/>
  <path d="M258 218 H312 L258 294 H312" fill="none" stroke="#0e7c86" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- one lean line out to the agent -->
  <path d="M344 256 H 384" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
  <circle cx="408" cy="256" r="38" fill="#ffffff"/>
  <circle cx="408" cy="256" r="15" fill="#0e7c86"/>
</svg>
